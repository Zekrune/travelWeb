spring.application.name=travel

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# Thymeleaf 설정
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# 정적 리소스 허용 (Spring Boot 2.x, 3.x 모두 지원)
spring.web.resources.static-locations=classpath:/static/

# OPENAI API KEY


# 관광 명소 API 설정


# 관광 명소 데이터 업데이트 스케줄링 설정
# 매일 새벽 3시에 실행
attraction.api.update.cron=0 0 3 * * ?
# 6시간마다 실행 (밀리초)
attraction.api.delta.update.interval=21600000

# 캐시 설정
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=1h

# 로깅 설정
logging.level.com.example.travel.attraction=INFO