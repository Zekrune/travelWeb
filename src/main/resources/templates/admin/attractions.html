<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワクワク 관리자 - 관광 명소 관리</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/admin/adminNav.css}">
    <link rel="stylesheet" th:href="@{/css/admin/adminMain.css}">
    <link rel="stylesheet" th:href="@{/css/main/main.css}">
    <style>
        .attraction-card {
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            background-color: white;
            margin-bottom: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
        }

        .attraction-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .attraction-image {
            height: 180px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .attraction-category {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .attraction-content {
            padding: 20px;
        }

        .attraction-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: -webkit-box;
            -webkit-line-clamp: 1;
            line-clamp: 1;
            -webkit-box-orient: vertical;
            box-orient: vertical;
            overflow: hidden;
        }

        .attraction-description {
            color: #555;
            margin-bottom: 15px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            box-orient: vertical;
            overflow: hidden;
            min-height: 3rem;
        }

        .attraction-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            color: #666;
        }

        .meta-item {
            display: flex;
            align-items: center;
        }

        .meta-item i {
            margin-right: 5px;
        }

        .attraction-actions {
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
        }

        .location-badge {
            display: inline-block;
            background-color: #f0f7ff;
            color: #3b82f6;
            padding: 3px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            margin-right: 5px;
            margin-bottom: 10px;
        }

        .average-rating {
            display: flex;
            align-items: center;
            color: #f59e0b;
            font-weight: 600;
        }

        .star-icon {
            color: #f59e0b;
            margin-right: 3px;
        }

        .status-badge {
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .status-active {
            background-color: #d1fae5;
            color: #10b981;
        }

        .status-pending {
            background-color: #fff7ed;
            color: #f59e0b;
        }

        .status-inactive {
            background-color: #fef2f2;
            color: #ef4444;
        }

        .category-filter {
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            background-color: #f3f4f6;
            color: #4b5563;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background-color: #6a11cb;
            color: white;
        }

        .add-attraction-btn {
            background-color: #6a11cb;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            bottom: 30px;
            right: 30px;
            box-shadow: 0 4px 12px rgba(106, 17, 203, 0.4);
            transition: all 0.3s;
            z-index: 100;
        }

        .add-attraction-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 16px rgba(106, 17, 203, 0.5);
        }

        /* 검색 바 스타일 */
        .search-bar {
            margin-bottom: 25px;
        }

        .search-input {
            border-radius: 25px;
            padding: 12px 20px;
            border: 1px solid #ddd;
            width: 100%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            transition: all 0.3s;
        }

        .search-input:focus {
            border-color: #6a11cb;
            box-shadow: 0 2px 10px rgba(106, 17, 203, 0.15);
            outline: none;
        }
    </style>
</head>

<body>
    <!-- 상단 네비게이션 바 포함 -->
    <div th:replace="~{admin/adminNav :: adminTopNav}"></div>

    <div class="wrapper">
        <div class="main-content">
            <div class="content-header">
                <h2>관광 명소 관리</h2>
                <p>부산의 모든 관광 명소를 관리하고 신규 명소를 추가할 수 있습니다.</p>
            </div>

            <!-- 검색 바 -->
            <div class="search-bar">
                <div class="row">
                    <div class="col-md-8">
                        <input type="text" class="search-input" placeholder="관광 명소 이름, 위치 또는 키워드로 검색...">
                    </div>
                </div>
            </div>

            <!-- 구군별 필터 (부산 지역구) -->
            <div class="category-filter">
                <a href="javascript:void(0)" class="filter-btn active" data-gugun="">전체</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="중구">중구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="서구">서구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="동구">동구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="영도구">영도구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="부산진구">부산진구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="동래구">동래구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="남구">남구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="북구">북구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="해운대구">해운대구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="사하구">사하구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="금정구">금정구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="강서구">강서구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="연제구">연제구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="수영구">수영구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="사상구">사상구</a>
                <a href="javascript:void(0)" class="filter-btn" data-gugun="기장군">기장군</a>
            </div>

            <!-- 현재 선택된 구/군 표시 -->
            <div class="current-district mb-4">
                <h3 id="currentGugun">부산 전체 관광 명소</h3>
            </div>

            <!-- 명소 요청 상태 탭 -->
            <ul class="nav nav-tabs mb-4">
                <li class="nav-item">
                    <a class="nav-link active" href="#">모든 명소</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        새 요청 <span class="badge bg-danger">5</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">
                        보류중 <span class="badge bg-warning">3</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">비활성화됨</a>
                </li>
            </ul>

            <div class="row" id="attractionList">
                <!-- 명소 카드 반복 -->
                <div class="col-md-6 col-lg-4 mb-4" th:each="attraction : ${attractions}" th:data-gugun="${attraction.gugunNm}">
                    <div class="attraction-card">
                        <div class="attraction-image"
                            th:style="${attraction.mainImgNormal != null} ? |background-image: url('${attraction.mainImgNormal}')| : |background-image: url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?q=80&w=1470&auto=format&fit=crop')|">
                            <div class="attraction-category" th:text="${attraction.gugunNm ?: '자연'}">자연</div>
                        </div>
                        <div class="attraction-content">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <h4 class="attraction-name" th:text="${attraction.mainTitle ?: '관광명소'}">관광명소</h4>
                                <span class="status-badge status-active">활성</span>
                            </div>

                            <div class="location-badge" th:text="${attraction.addr1 ?: '위치 정보 없음'}">위치 정보</div>

                            <p class="attraction-description" th:text="${attraction.itemcntnts ?: '설명 정보 없음'}">
                                설명 정보 없음
                            </p>

                            <div class="attraction-meta">
                                <div class="meta-item">
                                    <i class="fas fa-eye"></i>
                                    <span>0</span> 조회
                                </div>
                                <div class="meta-item">
                                    <i class="fas fa-users"></i>
                                    <span>0</span> 방문
                                </div>
                                <div class="meta-item average-rating">
                                    <i class="fas fa-star star-icon"></i>
                                    <span>0.0</span>
                                </div>
                            </div>

                            <div class="attraction-actions">
                                <div>
                                    <a th:href="@{'/attractions/' + ${attraction.id}}" target="_blank"
                                        class="btn btn-sm btn-outline-primary">
                                        <i class="fas fa-eye"></i> 보기
                                    </a>
                                    <button class="btn btn-sm btn-outline-secondary edit-btn"
                                        th:attr="data-id=${attraction.id}">
                                        <i class="fas fa-edit"></i> 수정
                                    </button>
                                </div>
                                <button class="btn btn-sm btn-outline-danger delete-btn"
                                    th:attr="data-id=${attraction.id}, data-title=${attraction.mainTitle}">
                                    <i class="fas fa-trash-alt"></i> 삭제
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 페이지네이션 -->
            <div class="d-flex justify-content-center mt-4">
                <nav aria-label="Page navigation">
                    <ul class="pagination">
                        <li class="page-item disabled">
                            <a class="page-link" href="#" tabindex="-1" aria-disabled="true">이전</a>
                        </li>
                        <li class="page-item active" aria-current="page">
                            <a class="page-link" href="#">1</a>
                        </li>
                        <li class="page-item"><a class="page-link" href="#">2</a></li>
                        <li class="page-item"><a class="page-link" href="#">3</a></li>
                        <li class="page-item">
                            <a class="page-link" href="#">다음</a>
                        </li>
                    </ul>
                </nav>
            </div>

            <!-- 명소 추가 버튼 -->
            <button class="add-attraction-btn" id="addAttractionBtn">
                <i class="fas fa-plus fa-lg"></i>
            </button>
        </div>
    </div>

    <!-- 명소 추가/수정 모달 -->
    <div class="modal fade" id="attractionModal" tabindex="-1" aria-labelledby="attractionModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="attractionModalLabel">관광 명소 추가</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="attractionForm">
                        <input type="hidden" id="attractionId" name="attractionId">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="mb-3">
                                    <label for="attractionName" class="form-label">명소 이름</label>
                                    <input type="text" class="form-control" id="attractionName" name="mainTitle" required>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="mb-3">
                                    <label for="attractionGugun" class="form-label">지역구</label>
                                    <select class="form-select" id="attractionGugun" name="gugunNm" required>
                                        <option value="">지역구 선택</option>
                                        <option value="중구">중구</option>
                                        <option value="서구">서구</option>
                                        <option value="동구">동구</option>
                                        <option value="영도구">영도구</option>
                                        <option value="부산진구">부산진구</option>
                                        <option value="동래구">동래구</option>
                                        <option value="남구">남구</option>
                                        <option value="북구">북구</option>
                                        <option value="해운대구">해운대구</option>
                                        <option value="사하구">사하구</option>
                                        <option value="금정구">금정구</option>
                                        <option value="강서구">강서구</option>
                                        <option value="연제구">연제구</option>
                                        <option value="수영구">수영구</option>
                                        <option value="사상구">사상구</option>
                                        <option value="기장군">기장군</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="attractionAddress" class="form-label">상세 주소</label>
                            <input type="text" class="form-control" id="attractionAddress" name="addr1">
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="attractionImageNormal" class="form-label">이미지 URL (일반)</label>
                                    <input type="url" class="form-control" id="attractionImageNormal" name="mainImgNormal"
                                        placeholder="이미지의 URL 링크를 입력하세요">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="attractionImageThumb" class="form-label">이미지 URL (썸네일)</label>
                                    <input type="url" class="form-control" id="attractionImageThumb" name="mainImgThumb"
                                        placeholder="썸네일 이미지의 URL 링크를 입력하세요">
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="attractionDescription" class="form-label">설명</label>
                            <textarea class="form-control" id="attractionDescription" name="itemcntnts" rows="4"></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="attractionTel" class="form-label">연락처</label>
                                    <input type="text" class="form-control" id="attractionTel" name="cntctTel">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="mb-3">
                                    <label for="attractionHomepage" class="form-label">홈페이지</label>
                                    <input type="url" class="form-control" id="attractionHomepage" name="homepageUrl">
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-primary" id="saveAttractionBtn">저장</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 및 jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        $(document).ready(function () {
            // 구/군 필터 버튼 클릭 이벤트
            $('.filter-btn').click(function () {
                $('.filter-btn').removeClass('active');
                $(this).addClass('active');

                const gugun = $(this).data('gugun');
                
                // 현재 선택된 구/군 표시 업데이트
                if (gugun === '') {
                    $('#currentGugun').text('부산 전체 관광 명소');
                } else {
                    $('#currentGugun').text(gugun + ' 관광 명소');
                }

                // 관광명소 필터링
                if (gugun === '') {
                    // 전체 보기
                    $('#attractionList > div').show();
                } else {
                    // 해당 구/군만 표시
                    $('#attractionList > div').hide();
                    $('#attractionList > div[data-gugun="' + gugun + '"]').show();
                }
            });

            // 명소 추가 버튼 클릭 이벤트
            $('#addAttractionBtn').click(function () {
                $('#attractionModalLabel').text('관광 명소 추가');
                $('#attractionForm')[0].reset();
                $('#attractionId').val(''); // ID 초기화
                $('#attractionModal').modal('show');
            });

            // 명소 수정 버튼 클릭 이벤트 (위임)
            $(document).on('click', '.edit-btn', function () {
                const id = $(this).data('id');
                $('#attractionModalLabel').text('관광 명소 수정');
                
                // AJAX로 해당 ID의 관광명소 데이터 가져오기
                $.ajax({
                    url: '/api/attractions/' + id,
                    type: 'GET',
                    success: function(data) {
                        // 폼에 데이터 채우기
                        $('#attractionId').val(data.id);
                        $('#attractionName').val(data.mainTitle);
                        $('#attractionGugun').val(data.gugunNm);
                        $('#attractionAddress').val(data.addr1);
                        $('#attractionImageNormal').val(data.mainImgNormal);
                        $('#attractionImageThumb').val(data.mainImgThumb);
                        $('#attractionDescription').val(data.itemcntnts);
                        $('#attractionTel').val(data.cntctTel);
                        $('#attractionHomepage').val(data.homepageUrl);
                        
                        $('#attractionModal').modal('show');
                    },
                    error: function() {
                        alert('관광명소 정보를 불러오는데 실패했습니다.');
                    }
                });
            });

            // 명소 삭제 버튼 클릭 이벤트 (위임)
            $(document).on('click', '.delete-btn', function () {
                const id = $(this).data('id');
                const title = $(this).data('title');

                if (confirm(`"${title}" 관광 명소를 삭제하시겠습니까?`)) {
                    // AJAX로 삭제 처리
                    $.ajax({
                        url: '/api/attractions/' + id,
                        type: 'DELETE',
                        success: function() {
                            alert('삭제되었습니다.');
                            // 화면에서 해당 카드 제거
                            $(`#attractionList > div:has([data-id="${id}"])`).remove();
                        },
                        error: function() {
                            alert('삭제에 실패했습니다.');
                        }
                    });
                }
            });

            // 저장 버튼 클릭 이벤트
            $('#saveAttractionBtn').click(function() {
                const formData = new FormData(document.getElementById('attractionForm'));
                const attractionId = $('#attractionId').val();

                // JSON 데이터로 변환
                const jsonData = {};
                formData.forEach((value, key) => {
                    jsonData[key] = value;
                });

                // 수정 또는 추가 처리
                const url = attractionId ? '/api/attractions/' + attractionId : '/api/attractions';
                const method = attractionId ? 'PUT' : 'POST';

                $.ajax({
                    url: url,
                    type: method,
                    contentType: 'application/json',
                    data: JSON.stringify(jsonData),
                    success: function() {
                        alert(attractionId ? '수정되었습니다.' : '추가되었습니다.');
                        $('#attractionModal').modal('hide');
                        // 페이지 새로고침
                        location.reload();
                    },
                    error: function() {
                        alert('저장에 실패했습니다.');
                    }
                });
            });
        });
    </script>
</body>

</html>
