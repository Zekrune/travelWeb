<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワクワク:관리자 - 문의 상세</title>
    <!-- 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- 아이콘용(폰트어썸) CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- CSS 파일 -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/counseling/counseling.css}">
</head>

<body>
    <!-- 네비게이션 바 포함 -->
    <div th:replace="~{nav :: navbar}"></div>

    <div class="counseling-header">
        <h1><i class="fas fa-headset"></i> 문의 상세 관리</h1>
        <a th:href="@{/admin/counseling}" class="btn">
            <i class="fas fa-list"></i> 목록으로
        </a>
    </div>

    <div class="container">
        <!-- 알림 메시지 -->
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="counseling-detail">
            <div class="counseling-header-detail">
                <h2 th:text="${counseling.title}">문의 제목</h2>
                <div class="counseling-meta">
                    <span class="category" th:text="${counseling.category.displayName}">일반 문의</span>
                    <span class="user" th:text="'작성자: ' + ${counseling.userId}">user123</span>
                    <span class="date" th:text="${#temporals.format(counseling.createdAt, 'yyyy-MM-dd HH:mm')}">2023-08-01 14:30</span>
                    <span th:if="${counseling.isPrivate}" class="private-badge">비공개</span>
                </div>
            </div>

            <div class="counseling-content">
                <p th:text="${counseling.content}">문의 내용</p>
            </div>

            <!-- 답변 영역 -->
            <div th:if="${counseling.isAnswered}" class="answer-section">
                <h3><i class="fas fa-reply"></i> 답변</h3>
                <div class="answer-meta">
                    <span class="admin" th:text="'답변자: ' + ${counseling.answeredBy}">관리자</span>
                    <span class="date" th:text="${#temporals.format(counseling.answeredAt, 'yyyy-MM-dd HH:mm')}">2023-08-02 10:15</span>
                </div>
                <div class="answer-content">
                    <p th:text="${counseling.answer}">답변 내용</p>
                </div>
            </div>

            <!-- 답변 폼 (미답변 상태일 때만 표시) -->
            <div th:unless="${counseling.isAnswered}" class="admin-answer-form">
                <h3><i class="fas fa-reply"></i> 답변 작성</h3>
                <form th:action="@{/admin/counseling/{id}/answer(id=${counseling.id})}" method="post">
                    <div class="form-group">
                        <textarea name="answer" rows="6" required placeholder="답변 내용을 입력해주세요"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn primary-btn">
                            <i class="fas fa-paper-plane"></i> 답변 등록
                        </button>
                    </div>
                </form>
            </div>

            <div class="action-buttons-detail">
                <a th:href="@{/admin/counseling}" class="btn secondary-btn">
                    <i class="fas fa-list"></i> 목록으로
                </a>
                <form th:action="@{/admin/counseling/{id}/delete(id=${counseling.id})}" method="post" 
                      onsubmit="return confirm('정말로 이 문의를 삭제하시겠습니까?');">
                    <button type="submit" class="btn danger-btn">
                        <i class="fas fa-trash-alt"></i> 삭제
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
