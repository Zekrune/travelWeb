<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${attraction.mainTitle + ' - ワクワク'}">관광 명소 상세 - ワクワク</title>
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/attractions/attractionDetail.css">
</head>

<body>
    <!-- 네비게이션 바 포함 -->
    <div th:replace="~{nav :: navbar}"></div>

    <div class="attraction-detail-container" th:if="${attraction != null}">
        <div class="attraction-header">
            <h1 class="attraction-title" th:text="${attraction.mainTitle}">관광 명소 이름</h1>
            <div class="attraction-subtitle"
                th:text="${attraction.subtitle != null && attraction.subtitle != '' ? attraction.subtitle : attraction.gugunNm}">
                부제목</div>
        </div>

        <div class="attraction-image-container">
            <img class="attraction-image" th:src="${attraction.mainImgNormal}" th:alt="${attraction.mainTitle}"
                onerror="this.src='/img/no-image.jpg'">
        </div>

        <div class="attraction-content" th:utext="${attraction.itemcntnts}">
            관광 명소 상세 내용
        </div>

        <div class="attraction-info-grid">
            <div class="info-item" th:if="${attraction.addr1 != null && attraction.addr1 != ''}">
                <div class="info-label">주소</div>
                <div class="info-value" th:text="${attraction.addr1}">주소</div>
            </div>

            <div class="info-item" th:if="${attraction.cntctTel != null && attraction.cntctTel != ''}">
                <div class="info-label">연락처</div>
                <div class="info-value" th:text="${attraction.cntctTel}">연락처</div>
            </div>

            <div class="info-item" th:if="${attraction.usageAmount != null && attraction.usageAmount != ''}">
                <div class="info-label">이용 요금</div>
                <div class="info-value" th:text="${attraction.usageAmount}">이용 요금</div>
            </div>

            <div class="info-item"
                th:if="${attraction.usageDayWeekAndTime != null && attraction.usageDayWeekAndTime != ''}">
                <div class="info-label">이용 시간</div>
                <div class="info-value" th:text="${attraction.usageDayWeekAndTime}">이용 시간</div>
            </div>

            <div class="info-item" th:if="${attraction.hldyInfo != null && attraction.hldyInfo != ''}">
                <div class="info-label">휴일 정보</div>
                <div class="info-value" th:text="${attraction.hldyInfo}">휴일 정보</div>
            </div>

            <div class="info-item" th:if="${attraction.trfcInfo != null && attraction.trfcInfo != ''}">
                <div class="info-label">교통 정보</div>
                <div class="info-value" th:text="${attraction.trfcInfo}">교통 정보</div>
            </div>

            <div class="info-item" th:if="${attraction.homepageUrl != null && attraction.homepageUrl != ''}">
                <div class="info-label">홈페이지</div>
                <div class="info-value">
                    <a th:href="${attraction.homepageUrl}" target="_blank" th:text="${attraction.homepageUrl}">홈페이지
                        URL</a>
                </div>
            </div>
        </div>

        <!-- 지도 표시 -->
        <div class="map-container" id="map" th:if="${attraction.lat != null && attraction.lng != null}"></div>

        <a href="/attractions" class="back-btn">목록으로 돌아가기</a>
    </div>

    <!-- 관광 명소가 없을 경우 -->
    <div class="not-found-container" th:if="${attraction == null}">
        <h1>관광 명소를 찾을 수 없습니다.</h1>
        <p>요청하신 관광 명소 정보를 찾을 수 없습니다.</p>
        <a href="/attractions" class="back-btn">목록으로 돌아가기</a>
    </div>

    <!-- 카카오맵 API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_MAP_API_KEY"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            const attraction = /*[[${attraction}]]*/ null;

            if (attraction && attraction.lat && attraction.lng) {
                const mapContainer = document.getElementById('map');
                const mapOption = {
                    center: new kakao.maps.LatLng(attraction.lat, attraction.lng),
                    level: 3
                };

                const map = new kakao.maps.Map(mapContainer, mapOption);

                // 마커 생성
                const markerPosition = new kakao.maps.LatLng(attraction.lat, attraction.lng);
                const marker = new kakao.maps.Marker({
                    position: markerPosition
                });

                // 마커 지도에 표시
                marker.setMap(map);

                // 인포윈도우 생성
                const infowindow = new kakao.maps.InfoWindow({
                    content: '<div style="padding:5px;font-size:12px;">' + attraction.mainTitle + '</div>'
                });

                // 인포윈도우 표시
                infowindow.open(map, marker);
            }
        });
    </script>
</body>
<script th:src="@{/js/script.js}"></script>

</html>
