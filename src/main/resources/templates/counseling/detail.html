<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワクワク: 문의 상세</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main/nav.css}">
    <link rel="stylesheet" th:href="@{/css/main/main.css}">
    <link rel="stylesheet" th:href="@{/css/counseling/detail.css}">
</head>

<body>
    <!-- 네비게이션 바 포함 -->
    <div th:replace="~{nav :: navbar}"></div>

    <div class="page-container">
        <div class="page-title">
            <h1><i class="fas fa-comment-dots"></i> 문의 상세</h1>
            <p>작성한 문의 내용과 답변을 확인할 수 있습니다.</p>
        </div>

        <div class="inquiry-detail">
            <div class="inquiry-header">
                <h2 class="inquiry-title" th:text="${counseling.title}">문의 제목</h2>
                <div class="inquiry-meta">
                    <span class="category-badge" th:text="${counseling.category.displayName}">일반 문의</span>
                    <div class="meta-item">
                        <i class="fas fa-calendar-alt"></i>
                        <span th:text="${#temporals.format(counseling.createdAt, 'yyyy-MM-dd HH:mm')}">2023-08-01 14:30</span>
                    </div>
                    <div class="meta-item" th:if="${counseling.isAnswered}">
                        <i class="fas fa-check-circle" style="color: var(--success);"></i>
                        <span>답변 완료</span>
                    </div>
                    <div class="meta-item" th:unless="${counseling.isAnswered}">
                        <i class="fas fa-clock" style="color: var(--warning);"></i>
                        <span>답변 대기중</span>
                    </div>
                </div>
            </div>

            <div class="inquiry-content">
                <p th:text="${counseling.content}">문의 내용이 표시됩니다.</p>
            </div>

            <!-- 답변 영역 -->
            <div th:if="${counseling.isAnswered}" class="answer-section">
                <div class="answer-header">
                    <i class="fas fa-reply"></i>
                    <span>답변</span>
                </div>
                <div class="answer-meta">
                    <div class="meta-item">
                        <i class="fas fa-user"></i>
                        <span th:text="${counseling.answeredBy}">관리자</span>
                    </div>
                    <div class="meta-item">
                        <i class="fas fa-calendar-check"></i>
                        <span th:text="${#temporals.format(counseling.answeredAt, 'yyyy-MM-dd HH:mm')}">2023-08-02 10:15</span>
                    </div>
                </div>
                <div class="answer-content">
                    <p th:text="${counseling.answer}">답변 내용이 표시됩니다.</p>
                </div>
            </div>

            <div th:unless="${counseling.isAnswered}" class="no-answer">
                <div class="no-answer-icon">
                    <i class="fas fa-hourglass-half"></i>
                </div>
                <p>아직 답변이 등록되지 않았습니다. 빠른 시일 내에 답변 드리겠습니다.</p>
            </div>

            <div class="button-group">
                <a th:href="@{/counseling}" class="btn btn-secondary">
                    <i class="fas fa-list"></i> 목록으로
                </a>
                <button id="deleteBtn" class="btn btn-danger">
                    <i class="fas fa-trash-alt"></i> 삭제하기
                </button>
                <a th:href="@{/counseling/create}" class="btn btn-primary">
                    <i class="fas fa-pen"></i> 새 문의 작성
                </a>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 모달 -->
    <div id="deleteModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-triangle" style="color: var(--danger);"></i> 문의 삭제</h3>
                <button id="closeModal" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p>정말로 이 문의를 삭제하시겠습니까?</p>
                <p style="color: var(--danger); font-size: 14px; margin-top: 10px;">
                    <i class="fas fa-info-circle"></i> 삭제한 문의는 복구할 수 없습니다.
                </p>
            </div>
            <div class="modal-footer">
                <button id="cancelDelete" class="btn btn-secondary">취소</button>
                <form th:action="@{/counseling/{id}/delete(id=${counseling.id})}" method="post">
                    <button type="submit" class="btn btn-danger">삭제</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // 모달 관련 스크립트
        const deleteBtn = document.getElementById('deleteBtn');
        const deleteModal = document.getElementById('deleteModal');
        const closeModal = document.getElementById('closeModal');
        const cancelDelete = document.getElementById('cancelDelete');

        deleteBtn.addEventListener('click', function() {
            deleteModal.style.display = 'flex';
        });

        closeModal.addEventListener('click', function() {
            deleteModal.style.display = 'none';
        });

        cancelDelete.addEventListener('click', function() {
            deleteModal.style.display = 'none';
        });

        // 모달 외부 클릭시 닫기
        window.addEventListener('click', function(event) {
            if (event.target === deleteModal) {
                deleteModal.style.display = 'none';
            }
        });
    </script>

    <script th:src="@{/js/main/nav.js}"></script>
</body>

</html>
