<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワクワク:자주 묻는 질문</title>
    <!-- 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- 아이콘용(폰트어썸) CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- CSS 파일 -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/counseling/counseling.css}">
</head>

<body>
    <!-- 네비게이션 바 포함 -->
    <div th:replace="~{nav :: navbar}"></div>

    <div class="counseling-header">
        <h1><i class="fas fa-comment-dots"></i> 자주 묻는 질문</h1>
        <a th:href="@{/counseling}" class="btn">
            <i class="fas fa-list"></i> 목록으로
        </a>
    </div>

    <div class="container">
        <div class="counseling-detail">
            <div class="counseling-header-detail">
                <h2 th:text="${counseling.title}">문의 제목</h2>
                <div class="counseling-meta">
                    <span class="category" th:text="${counseling.category.displayName}">일반 문의</span>
                    <span class="date" th:text="${#temporals.format(counseling.createdAt, 'yyyy-MM-dd HH:mm')}">2023-08-01 14:30</span>
                    <span th:if="${counseling.isPrivate}" class="private-badge">비공개</span>
                </div>
            </div>

            <div class="counseling-content">
                <p th:text="${counseling.content}">문의 내용</p>
            </div>

            <!-- 답변 영역 -->
            <div th:if="${counseling.isAnswered}" class="answer-section">
                <h3><i class="fas fa-reply"></i> 답변</h3>
                <div class="answer-meta">
                    <span class="admin" th:text="'답변자: ' + ${counseling.answeredBy}">관리자</span>
                    <span class="date" th:text="${#temporals.format(counseling.answeredAt, 'yyyy-MM-dd HH:mm')}">2023-08-02 10:15</span>
                </div>
                <div class="answer-content">
                    <p th:text="${counseling.answer}">답변 내용</p>
                </div>
            </div>

            <div th:unless="${counseling.isAnswered}" class="no-answer">
                <p><i class="fas fa-hourglass-half"></i> 아직 답변이 등록되지 않았습니다. 빠른 시일 내에 답변 드리겠습니다.</p>
            </div>

            <div class="action-buttons-detail">
                <a th:href="@{/counseling}" class="btn secondary-btn">
                    <i class="fas fa-list"></i> 목록으로
                </a>
                <a th:href="@{/counseling/create}" class="btn primary-btn">
                    <i class="fas fa-pen"></i> 새 문의 작성
                </a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
