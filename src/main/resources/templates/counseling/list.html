<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワクワク: 문의 내역</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main/nav.css}">
    <link rel="stylesheet" th:href="@{/css/main/main.css}">
    <link rel="stylesheet" th:href="@{/css/counseling/list.css}">
</head>

<body>
    <!-- 네비게이션 바 포함 -->
    <div th:replace="~{nav :: navbar}"></div>

    <div class="page-container">
        <div class="page-title">
            <h1><i class="fas fa-comments"></i> 1:1문의 내역</h1>
            <p>문의사항 및 답변을 확인할 수 있습니다.</p>
        </div>

        <!-- 알림 메시지 -->
        <div th:if="${message}" class="alert alert-success">
            <i class="fas fa-check-circle"></i>
            <span th:text="${message}"></span>
        </div>
        <div th:if="${param.error}" class="alert alert-danger">
            <i class="fas fa-exclamation-circle"></i>
            <span th:if="${param.error == 'unauthorized'}">접근 권한이 없습니다.</span>
            <span th:if="${param.error == 'not_found'}">존재하지 않는 문의입니다.</span>
        </div>

        <div class="counseling-container">
            <div class="counseling-header">
                <div>
                    <h2 style="margin: 0; font-size: 18px;">내 문의 목록</h2>
                </div>
                <a th:href="@{/counseling/create}" class="new-inquiry-btn">
                    <i class="fas fa-plus"></i> 새 문의 작성
                </a>
            </div>

            <!-- 빈 상태 -->
            <div th:if="${counselings.empty}" class="empty-state">
                <div class="empty-state-icon">
                    <i class="fas fa-inbox"></i>
                </div>
                <div class="empty-state-message">작성한 문의가 없습니다.</div>
                <a th:href="@{/counseling/create}" class="new-inquiry-btn">
                    <i class="fas fa-plus"></i> 새 문의 작성
                </a>
            </div>

            <!-- 문의 테이블 -->
            <table th:if="${!counselings.empty}" class="inquiry-table">
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>제목</th>
                        <th>카테고리</th>
                        <th>작성일</th>
                        <th>상태</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="counseling : ${counselings}">
                        <td th:text="${counseling.id}">1</td>
                        <td>
                            <a th:href="@{/counseling/{id}(id=${counseling.id})}" class="inquiry-title" 
                               th:text="${counseling.title}">문의 제목</a>
                        </td>
                        <td th:text="${counseling.category.displayName}">일반 문의</td>
                        <td th:text="${#temporals.format(counseling.createdAt, 'yyyy-MM-dd')}">2023-08-01</td>
                        <td>
                            <span th:if="${counseling.isAnswered}" class="status-badge status-answered">답변완료</span>
                            <span th:unless="${counseling.isAnswered}" class="status-badge status-waiting">답변대기</span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- 페이지네이션 -->
            <div th:if="${!counselings.empty}" class="pagination">
                <a th:if="${counselings.hasPrevious()}" th:href="@{/counseling(page=${counselings.number - 1})}"
                    class="page-link"><i class="fas fa-chevron-left"></i></a>
                
                <!-- 페이지 번호 -->
                <span th:each="i : ${#numbers.sequence(0, counselings.totalPages - 1)}" 
                      th:if="${i >= counselings.number - 2 && i <= counselings.number + 2}">
                    <a th:href="@{/counseling(page=${i})}" 
                       th:class="${i == counselings.number} ? 'page-link active' : 'page-link'" 
                       th:text="${i + 1}">1</a>
                </span>
                
                <a th:if="${counselings.hasNext()}" th:href="@{/counseling(page=${counselings.number + 1})}"
                    class="page-link"><i class="fas fa-chevron-right"></i></a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/main/nav.js}"></script>
</body>

</html>
