<header th:fragment="navbar" class="standard-navbar">
    <div class="nav-container">
        <a th:href="@{/main}" class="logo">
            <div class="logo-wrapper">
                <span class="logo-main">ワクワク</span>
            </div>
        </a>
        <nav class="nav-links">
            <a th:href="@{/attractions}" class="nav-item">관광 명소</a>
            <a th:href="@{/itineraries/mainPage}" class="nav-item">여행 생성</a>
            <a href="#" class="nav-item">커뮤니티</a>
            <a th:href="@{/counseling/faq}" class="nav-item">고객지원</a>

            <!-- 알림 아이콘 및 드롭다운 -->
            <div class="notification-menu">
                <button type="button" class="notification-icon">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" th:if="${notifications != null && !notifications.isEmpty()}">
                        <span th:text="${notifications.size()}">0</span>
                    </span>
                </button>
                <div class="notification-dropdown" id="notificationDropdown">
                    <div class="notification-header">
                        <h3>알림</h3>
                        <a href="#" class="mark-all-read">모두 읽음 표시</a>
                    </div>

                    <!-- 알림이 없을 경우 -->
                    <div th:if="${notifications == null || notifications.isEmpty()}" class="empty-notifications">
                        <p>새로운 알림이 없습니다</p>
                    </div>

                    <!-- 알림이 있을 경우 -->
                    <div th:unless="${notifications == null || notifications.isEmpty()}" class="notification-items">
                        <div th:each="notification : ${notifications}" class="notification-item">
                            <div class="notification-icon" th:classappend="${notification.type}">
                                <i th:class="${notification.icon}"></i>
                            </div>
                            <div class="notification-content">
                                <p th:text="${notification.message}">제주도 여행이 3일 남았습니다.</p>
                                <span class="notification-time" th:text="${notification.time}">1시간 전</span>
                            </div>
                            <button class="notification-dismiss">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                    </div>

                    <div class="notification-footer">
                        <a href="/notifications">모든 알림 보기</a>
                    </div>
                </div>
            </div>

            <div class="user-menu">
                <a href="#" class="user-icon" onclick="toggleMenu()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <span>마이페이지</span>
                </a>
                <div class="dropdown-menu" id="dropdownMenu">
                    <a th:href="@{/schedule/mypage}">나의 여행</a>
                    <a th:href="@{/counseling}">1:1 문의</a>
                    <a th:href="@{/users/logout}">로그아웃</a>
                </div>
            </div>
        </nav>
    </div>
</header>
