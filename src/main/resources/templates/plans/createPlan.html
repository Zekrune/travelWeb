<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <title>ワクワク:여행 일정 생성</title>
    <!-- 예시 아이콘용(폰트어썸) CDN (필요 시 제거/변경 가능) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
        integrity="sha512-acmXf6X10CqU2tyNYL/v7+YjFGv1IMZBCqYCK4RFY5cfkNdxdK2wLDMA4dlVaR49kWuSnA5W0/4aAMUyQXo1ww=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" th:href="@{/css/plan/createPlan.css}">
    <script th:src="@{/js/plan/createPlan.js}"></script>
</head>

<body>
    <div class="container">
        <h1>여행 일정 생성</h1>

        <!-- Step 1: 출발지/목적지 + 2개월 달력 -->
        <div class="step active" id="step1">
            <h2><i class="fas fa-map-marked-alt"></i> 목적지 및 날짜 선택</h2>
            <div class="form-group">
                <label for="departLocation">출발지</label>
                <input type="text" id="departLocation" placeholder="예: 서울" required />
            </div>
            <div class="form-group">
                <label for="destination">목적지</label>
                <input type="text" id="destination" placeholder="예: 오사카" required />
            </div>

            <p style="text-align:center; color:#666;">
                * 여행 기간(여행지 도착 날짜, 여행지 출발 날짜)을 선택해 주세요.
            </p>

            <!-- 2개월 달력 -->
            <div class="calendar-container">
                <div class="calendar-header">
                    <button id="prevBtn" class="arrow-btn">&lt;</button>
                    <div class="month-year" id="monthYearLabel"></div>
                    <button id="nextBtn" class="arrow-btn">&gt;</button>
                </div>
                <div class="calendars">
                    <div class="calendar">
                        <table class="calendar-table" id="calendar1">
                            <thead>
                                <tr>
                                    <th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <div class="calendar">
                        <table class="calendar-table" id="calendar2">
                            <thead>
                                <tr>
                                    <th>일</th><th>월</th><th>화</th><th>수</th><th>목</th><th>금</th><th>토</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <div class="btn-container">
                <button class="btn" type="button" onclick="goNextFromStep1()">다음</button>
            </div>
        </div>

        <!-- Step 2: 교통 수단 -->
        <div class="step" id="step2">
            <h2><i class="fas fa-plane"></i> 교통 수단 선택</h2>
            <div class="transportation-options">
                <div class="transport-box" data-value="비행기" onclick="selectTransportation(this)">
                    <i class="fas fa-plane"></i>
                    <span>비행기</span>
                </div>
                <div class="transport-box" data-value="기차" onclick="selectTransportation(this)">
                    <i class="fas fa-train"></i>
                    <span>기차</span>
                </div>
                <div class="transport-box" data-value="버스" onclick="selectTransportation(this)">
                    <i class="fas fa-bus"></i>
                    <span>버스</span>
                </div>
                <div class="transport-box" data-value="자동차" onclick="selectTransportation(this)">
                    <i class="fas fa-car"></i>
                    <span>자동차</span>
                </div>
            </div>

            <div class="btn-container">
                <button class="btn" type="button" onclick="prevStep()">이전</button>
                <button class="btn" type="button" onclick="nextStep()">다음</button>
            </div>
        </div>

        <!-- Step 3: 여행 목적, 예산, 밀도 -->
        <div class="step" id="step3">
            <h2><i class="fas fa-bullseye"></i> 여행 목적 및 예산</h2>
            <div class="form-group">
                <label for="purpose">여행 목적</label>
                <input type="text" id="purpose" placeholder="예: 맛집 탐방, 관광, 휴양 등" />
            </div>
            <div class="form-group">
                <label for="budget">예산(원)</label>
                <input type="number" id="budget" placeholder="예: 500000" />
            </div>
            <div class="form-group">
                <label for="density">여행 밀도</label>
                <input type="text" id="density" placeholder="예: 여유롭게, 빡빡하게 등" />
            </div>

            <div class="btn-container">
                <button class="btn" type="button" onclick="prevStep()">이전</button>
                <button class="btn" type="button" onclick="nextStep()">다음</button>
            </div>
        </div>

        <!-- Step 4: 숙소 및 이동 방식 -->
        <div class="step" id="step4">
            <h2><i class="fas fa-hotel"></i> 숙소 및 이동 방식</h2>
            <div class="form-group">
                <label for="hotelLocation">숙소 위치</label>
                <input type="text" id="hotelLocation" placeholder="예: 도톤보리 근처" />
            </div>
            <div class="form-group">
                <label for="travelMode">이동 방식</label>
                <select id="travelMode">
                    <option value="도보">도보</option>
                    <option value="대중교통">대중교통</option>
                    <option value="렌터카">렌터카</option>
                </select>
            </div>

            <div class="btn-container">
                <button class="btn" type="button" onclick="prevStep()">이전</button>
                <button class="btn" type="button" onclick="nextStep()">다음</button>
            </div>
        </div>

        <!-- Step 5: 최종 확인 및 제출 -->
        <div class="step" id="step5">
            <h2><i class="fas fa-check-circle"></i> 입력 완료</h2>
            <p>선택한 여행 정보를 확인하세요.</p>
            <div id="summary"></div>

            <div class="btn-container">
                <button class="btn" type="button" onclick="prevStep()">이전</button>
                <button class="btn" type="button" onclick="submitPlan()">제출</button>
            </div>
        </div>
    </div>
</body>

</html>
