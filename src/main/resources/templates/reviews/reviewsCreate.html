<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>리뷰 작성 페이지</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');

        :root {
            --primary-color: #1e88e5;
            --secondary-color: #f5f5f5;
            --accent-color: #ff6d00;
            --success-color: #4caf50;
            --danger-color: #e53935;
            --text-color: #333;
            --light-text: #666;
            --white: #fff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.1);
            --hover-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f8f9fa;
            color: var(--text-color);
            line-height: 1.6;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 50px auto;
            background-color: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .form-header {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 2rem;
            text-align: center;
            position: relative;
        }

        .form-title {
            font-size: 2rem;
            font-weight: 700;
            margin: 0;
        }

        .form-subtitle {
            margin-top: 0.5rem;
            font-weight: 300;
            opacity: 0.9;
        }

        .form-icon {
            position: absolute;
            top: 1.5rem;
            left: 1.5rem;
            font-size: 1.5rem;
        }

        .form-content {
            padding: 2rem;
        }

        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 2rem;
            position: relative;
        }

        .progress-bar::before {
            content: "";
            position: absolute;
            top: 15px;
            left: 0;
            width: 100%;
            height: 3px;
            background-color: #e0e0e0;
            z-index: 1;
        }

        .progress-bar::after {
            content: "";
            position: absolute;
            top: 15px;
            left: 0;
            width: 50%;
            /* 진행 상태에 따라 조정 */
            height: 3px;
            background-color: var(--primary-color);
            z-index: 2;
            transition: width 0.3s ease;
        }

        .step {
            width: 33px;
            height: 33px;
            border-radius: 50%;
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--white);
            font-weight: 500;
            position: relative;
            z-index: 3;
        }

        .step.active {
            background-color: var(--primary-color);
        }

        .step.completed {
            background-color: var(--success-color);
        }

        .step-label {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            white-space: nowrap;
            font-size: 0.8rem;
            color: var(--light-text);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: var(--text-color);
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: var(--radius);
            transition: all 0.3s ease;
            font-family: 'Noto Sans KR', sans-serif;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(30, 136, 229, 0.2);
        }

        .form-control.error {
            border-color: var(--danger-color);
        }

        .error-message {
            color: var(--danger-color);
            font-size: 0.85rem;
            margin-top: 0.5rem;
            display: none;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 180px;
        }

        .rating-container {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .rating-label {
            font-weight: 500;
            margin-right: 1rem;
            min-width: 100px;
        }

        .stars {
            display: flex;
            gap: 0.5rem;
        }

        .star {
            font-size: 1.5rem;
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .star.active {
            color: #ffc107;
        }

        .star:hover {
            color: #ffdb70;
        }

        .image-upload {
            margin-bottom: 1.5rem;
        }

        .image-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 1rem;
        }

        .preview-item {
            position: relative;
            width: 100px;
            height: 100px;
            border-radius: 8px;
            overflow: hidden;
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .remove-image {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 20px;
            height: 20px;
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            font-size: 0.7rem;
        }

        .custom-file-upload {
            display: inline-block;
            padding: 0.8rem 1.5rem;
            background-color: #f0f0f0;
            color: var(--text-color);
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .custom-file-upload:hover {
            background-color: #e0e0e0;
        }

        .custom-file-upload i {
            margin-right: 8px;
        }

        input[type="file"] {
            display: none;
        }

        .tag-container {
            margin-bottom: 1.5rem;
        }

        .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }

        .tag {
            display: inline-flex;
            align-items: center;
            background-color: #e3f2fd;
            color: var(--primary-color);
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .tag .remove-tag {
            margin-left: 6px;
            cursor: pointer;
        }

        .tag-input {
            display: flex;
            margin-top: 10px;
        }

        .tag-input input {
            flex: 1;
            padding: 0.8rem 1rem;
            border: 1px solid #ddd;
            border-radius: var(--radius) 0 0 var(--radius);
            font-size: 0.9rem;
        }

        .tag-input input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .tag-input button {
            padding: 0.8rem 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0 var(--radius) var(--radius) 0;
            cursor: pointer;
        }

        .button-container {
            display: flex;
            justify-content: space-between;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.8rem 2rem;
            font-size: 1rem;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white);
        }

        .btn-primary:hover {
            background-color: #1976d2;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--light-text);
            border: 1px solid #ddd;
        }

        .btn-outline:hover {
            background-color: #f5f5f5;
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: var(--white);
        }

        .btn-danger:hover {
            background-color: #d32f2f;
        }

        .form-footer {
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid #eee;
            color: var(--light-text);
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                width: 95%;
                margin: 20px auto;
            }

            .form-header {
                padding: 1.5rem;
            }

            .form-title {
                font-size: 1.5rem;
            }

            .form-content {
                padding: 1.5rem;
            }

            .step-label {
                font-size: 0.7rem;
            }

            .button-container {
                flex-direction: column-reverse;
                gap: 1rem;
            }

            .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="form-header">
            <i class="fas fa-pen-to-square form-icon"></i>
            <h1 class="form-title">리뷰 작성</h1>
            <p class="form-subtitle">부산 관광 명소에 대한 솔직한 경험을 공유해주세요</p>
        </div>

        <div class="form-content">
            <div class="progress-bar">
                <div class="step active">
                    <span>1</span>
                    <span class="step-label">기본 정보</span>
                </div>
                <div class="step">
                    <span>2</span>
                    <span class="step-label">세부 평가</span>
                </div>
                <div class="step">
                    <span>3</span>
                    <span class="step-label">사진 첨부</span>
                </div>
            </div>

            <form id="review-form">
                <div class="form-group">
                    <label for="location">관광지 선택</label>
                    <select class="form-control" id="location" required>
                        <option value="" disabled selected>방문한 관광지를 선택해주세요</option>
                        <option value="해운대">해운대 해수욕장</option>
                        <option value="광안리">광안리 해수욕장</option>
                        <option value="감천문화마을">감천문화마을</option>
                        <option value="태종대">태종대</option>
                        <option value="송정해수욕장">송정 해수욕장</option>
                        <option value="자갈치시장">자갈치 시장</option>
                        <option value="흰여울문화마을">흰여울 문화마을</option>
                        <option value="부산타워">부산타워</option>
                        <option value="국제시장">국제시장</option>
                        <option value="청사포">청사포</option>
                        <option value="오륙도">오륙도 스카이워크</option>
                        <option value="두미도">두미도</option>
                        <option value="other">기타 (직접 입력)</option>
                    </select>
                </div>

                <div class="form-group" id="other-location-group" style="display: none;">
                    <label for="other-location">관광지 직접 입력</label>
                    <input type="text" class="form-control" id="other-location" placeholder="방문한 관광지 이름을 입력하세요">
                </div>

                <div class="form-group">
                    <label for="title">리뷰 제목</label>
                    <input type="text" class="form-control" id="title" placeholder="리뷰 제목을 입력하세요" required>
                </div>

                <div class="rating-container">
                    <span class="rating-label">전체 평점</span>
                    <div class="stars">
                        <i class="fas fa-star star" data-rating="1"></i>
                        <i class="fas fa-star star" data-rating="2"></i>
                        <i class="fas fa-star star" data-rating="3"></i>
                        <i class="fas fa-star star" data-rating="4"></i>
                        <i class="fas fa-star star" data-rating="5"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="content">상세 리뷰</label>
                    <textarea class="form-control" id="content"
                        placeholder="관광지에 대한 솔직한 경험과 느낌을 자세히 공유해주세요. 장점, 단점, 팁 등 다른 여행자들에게 도움이 될 만한 정보가 있다면 함께 알려주세요."
                        required></textarea>
                </div>

                <div class="tag-container">
                    <label>관련 태그</label>
                    <div class="tags">
                        <span class="tag">바다 <i class="fas fa-times remove-tag"></i></span>
                        <span class="tag">야경 <i class="fas fa-times remove-tag"></i></span>
                    </div>
                    <div class="tag-input">
                        <input type="text" id="tag-input" placeholder="태그 입력 후 추가 버튼 클릭">
                        <button type="button">추가</button>
                    </div>
                </div>

                <div class="image-upload">
                    <label>사진 업로드</label>
                    <p style="font-size: 0.9rem; color: var(--light-text); margin-bottom: 1rem;">최대 5장까지 업로드 가능합니다.</p>
                    <label for="photo" class="custom-file-upload">
                        <i class="fas fa-camera"></i> 사진 선택하기
                    </label>
                    <input type="file" id="photo" accept="image/*" multiple>

                    <div class="image-preview">
                        <div class="preview-item">
                            <img src="/api/placeholder/400/320" alt="미리보기">
                            <span class="remove-image"><i class="fas fa-times"></i></span>
                        </div>
                    </div>
                </div>

                <div class="button-container">
                    <button type="button" class="btn btn-outline"
                        onclick="window.location.href='index.html';">취소하기</button>
                    <button type="submit" class="btn btn-primary">리뷰 등록하기</button>
                </div>

                <div class="form-footer">
                    <p>* 작성하신 리뷰는 관리자 확인 후 게시됩니다.</p>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 별점 선택 기능
        document.querySelectorAll('.star').forEach(star => {
            star.addEventListener('click', function () {
                const rating = this.getAttribute('data-rating');
                document.querySelectorAll('.star').forEach(s => {
                    if (s.getAttribute('data-rating') <= rating) {
                        s.classList.add('active');
                    } else {
                        s.classList.remove('active');
                    }
                });
            });
        });

        // 기타 관광지 선택 시 직접 입력 필드 표시
        document.getElementById('location').addEventListener('change', function () {
            if (this.value === 'other') {
                document.getElementById('other-location-group').style.display = 'block';
            } else {
                document.getElementById('other-location-group').style.display = 'none';
            }
        });

        // 태그 삭제 기능
        document.querySelectorAll('.remove-tag').forEach(btn => {
            btn.addEventListener('click', function () {
                this.parentElement.remove();
            });
        });
    </script>
</body>

</html>
