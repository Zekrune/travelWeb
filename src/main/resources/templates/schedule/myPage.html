<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Travel Plans</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/schedule/myPage.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>

<body>
    <!-- 네비게이션 바 포함 -->
    <div th:replace="~{nav :: navbar}"></div>

    <!-- Profile Section -->
    <div class="profile-container">
        <div class="profile-pic">
            <i class="fas fa-user"></i>
        </div>
        <div class="username" th:text="${#authentication.name}">user7593241001</div>
        <div class="profile-badge">프로필 관리 <i class="fas fa-star"></i></div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
        <div class="tab active" id="tab-upcoming">나의 일정 <span th:text="${schedules.size()}">1</span></div>
        <div class="tab" id="tab-history">나의 여행 도시 목록 <span>0</span></div>
    </div>

    <!-- Content -->
    <div class="content-container">
        <!-- Upcoming Travel Plans Tab -->
        <div class="tab-content active" id="content-upcoming">
            <div class="filter-bar">
                <div class="filter-title">
                    예정된 여행
                </div>
                <div class="sort-options">
                    <div class="sort-option active" id="sort-newest">최신순</div>
                    <div class="sort-option" id="sort-oldest">오래된순</div>
                </div>
            </div>

            <!-- Travel Cards -->
            <div th:if="${schedules.isEmpty()}" class="no-plans">
                <p>아직 확정된 여행 일정이 없습니다.</p>
            </div>

            <div id="travel-cards-container">
                <div th:each="sch : ${schedules}" class="travel-card" th:data-date="${sch.createdAt}"
                    th:onclick="|window.location='/schedule/details/' + ${sch.id}|">
                    <div class="card-image"
                        th:style="${sch.planPhoto != null && !sch.planPhoto.isEmpty()} ? |background-image: url('${sch.planPhoto}')| : |background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2073&auto=format&fit=crop')|">
                    </div>
                    <div class="card-content">
                        <div class="card-label" th:text="${sch.purpose}">후쿠오카</div>
                        <h3 class="card-title" th:text="${sch.planName}">여행 계획 이름</h3>
                        <div class="card-details">
                            <span th:text="'출발: ' + ${sch.departLocation} + ' | 목적지: ' + ${sch.destination}">출발: 서울 |
                                목적지: 후쿠오카</span>
                        </div>
                        <div class="card-date">
                            <i class="far fa-calendar-alt" style="margin-right: 5px;"></i>
                            <span th:text="${sch.startDate} + ' ~ ' + ${sch.endDate}">2024-02-04 ~ 2024-02-08</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Travel History Tab -->
        <div class="tab-content" id="content-history">
            <div class="filter-bar">
                <div class="filter-title">
                    여행 히스토리
                    <span class="filter-icon"><i class="fas fa-sort-down"></i></span>
                </div>
            </div>

            <!-- 여행 히스토리는 아직 구현되지 않았으므로 안내 메시지 표시 -->
            <div class="no-plans">
                <p>아직 여행 히스토리가 없습니다.</p>
                <p style="margin-top: 10px; font-size: 14px;">여행을 다녀오신 후 기록을 추가해보세요!</p>
            </div>
        </div>
    </div>
</body>
<script src="/js/schedule/myPage.js"></script>
<script th:src="@{/js/script.js}"></script>
</html>
