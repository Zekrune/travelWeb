<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Plan Details</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/schedule/myPagedetails.css}">
</head>

<body>
    <!-- Header -->
    <div class="header">
        <div class="back-button" onclick="window.location='/schedule/mypage'">
            <i class="fas fa-arrow-left"></i>
        </div>
        <div class="header-title">여행 상세</div>
        <div class="header-actions">
            <i class="fas fa-ellipsis-v"></i>
        </div>
    </div>

    <!-- Banner with Plan Title -->
    <div class="banner"
        th:style="${scheduleItem.planPhoto != null && !scheduleItem.planPhoto.isEmpty()} ? |background-image: url('${scheduleItem.planPhoto}')| : |background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=2073&auto=format&fit=crop')|">
        <div class="banner-overlay">
            <div class="plan-title" th:text="${scheduleItem.planName}">여행 계획 이름</div>
            <div class="plan-dates">
                <i class="far fa-calendar-alt"></i>
                <span th:text="${scheduleItem.startDate} + ' ~ ' + ${scheduleItem.endDate}">2024-02-04 ~
                    2024-02-08</span>
            </div>
        </div>
    </div>

    <!-- Content -->
    <div class="content-container">
        <!-- Plan Information Card -->
        <div class="info-card">
            <div class="card-header">
                <i class="fas fa-info-circle"></i> 여행 정보
            </div>
            <div class="card-body">
                <div class="info-row">
                    <div class="info-label">출발지</div>
                    <div class="info-value" th:text="${scheduleItem.departLocation}">서울</div>
                </div>
                <div class="info-row">
                    <div class="info-label">목적지</div>
                    <div class="info-value" th:text="${scheduleItem.destination}">후쿠오카</div>
                </div>
                <div class="info-row">
                    <div class="info-label">여행 목적</div>
                    <div class="info-value" th:text="${scheduleItem.purpose}">관광</div>
                </div>
                <div class="info-row">
                    <div class="info-label">교통 수단</div>
                    <div class="info-value" th:text="${scheduleItem.transportation}">비행기</div>
                </div>
                <div class="info-row">
                    <div class="info-label">예산</div>
                    <div class="info-value" th:text="${scheduleItem.budget} + '원'">500,000원</div>
                </div>
                <div class="info-row">
                    <div class="info-label">여행 밀도</div>
                    <div class="info-value" th:text="${scheduleItem.density}">적당히</div>
                </div>
                <div class="info-row">
                    <div class="info-label">숙소 위치</div>
                    <div class="info-value" th:text="${scheduleItem.hotelLocation}">텐진역 근처</div>
                </div>
                <div class="info-row">
                    <div class="info-label">이동 방식</div>
                    <div class="info-value" th:text="${scheduleItem.travelMode}">대중교통</div>
                </div>
                <div class="info-row">
                    <div class="info-label">생성 일자</div>
                    <div class="info-value" th:text="${#temporals.format(scheduleItem.createdAt, 'yyyy-MM-dd HH:mm')}">
                        2023-11-30 15:30</div>
                </div>
            </div>
        </div>

        <!-- Plan Description Card -->
        <div class="info-card"
            th:if="${scheduleItem.planDescription != null && !scheduleItem.planDescription.isEmpty()}">
            <div class="card-header">
                <i class="fas fa-align-left"></i> 여행 설명
            </div>
            <div class="card-body">
                <p th:text="${scheduleItem.planDescription}">여행 설명 내용이 여기에 표시됩니다.</p>
            </div>
        </div>

        <!-- Itinerary Card -->
        <div class="info-card">
            <div class="card-header">
                <i class="fas fa-map-marked-alt"></i> 일정 상세
            </div>
            <div class="card-body">
                <div id="itineraryContainer" class="itinerary-container">
                    <table id="itineraryTable" style="width: 100%; border-collapse: collapse;">
                        <thead>
                            <tr>
                                <th>날짜</th>
                                <th>시간</th>
                                <th>카테고리</th>
                                <th>장소</th>
                                <th>소요 시간</th>
                                <th>비용</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- 일정이 여기에 추가됩니다. -->
                        </tbody>
                    </table>
                </div>

                <!-- Raw JSON (hidden by default, can be toggled) -->
                <div class="json-container" style="display: none;" th:text="${scheduleItem.scheduleJson}"></div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="action-button primary-button">
                <i class="fas fa-edit"></i> 일정 수정
            </button>
            <button class="action-button secondary-button">
                <i class="fas fa-share-alt"></i> 공유하기
            </button>
        </div>
    </div>

    <script th:inline="javascript">
        const jsonData = /*[[${scheduleItem.scheduleJson}]]*/ '{}'; // JSON 데이터 가져오기
        const parsedData = JSON.parse(jsonData); // JSON 파싱

        // 일정 테이블에 데이터 추가
        const itineraryTableBody = document.getElementById('itineraryTable').getElementsByTagName('tbody')[0];

        // itinerary 배열이 존재하는지 확인
        if (parsedData.travelPlan && parsedData.travelPlan.itinerary) {
            parsedData.travelPlan.itinerary.forEach(day => {
                const date = day.date; // 날짜
                day.schedule.forEach(item => {
                    const row = itineraryTableBody.insertRow(); // 새로운 행 추가
                    row.insertCell(0).textContent = date; // 날짜
                    row.insertCell(1).textContent = item.departureTime; // 시간
                    row.insertCell(2).textContent = item.category; // 카테고리
                    row.insertCell(3).textContent = item.location; // 장소
                    row.insertCell(4).textContent = item.duration; // 소요 시간
                    row.insertCell(5).textContent = item.cost; // 비용
                });
            });
        } else {
            // 일정이 없을 경우 메시지 표시
            const row = itineraryTableBody.insertRow();
            const cell = row.insertCell(0);
            cell.colSpan = 6; // 모든 열을 합침
            cell.textContent = '일정 정보가 없습니다.';
            cell.style.textAlign = 'center';
        }
    </script>
</body>

</html>
