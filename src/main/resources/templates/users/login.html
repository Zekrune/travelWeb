<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ワクワク: 로그인</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link rel="stylesheet" href="/css/users/login.css">
</head>

<body>
    <form class="login-container" action="/users/login" method="post" th:object="${user}">
        <div class="logo">ワクワク</div>
        <p class="subtitle">부산 여행의 모든 것, AI 여행 플래너로 간편하게</p>

        <input type="text" th:field="*{username}" placeholder="아이디" required>
        <input type="password" th:field="*{password}" placeholder="비밀번호" required>

        <button type="submit" class="btn-login">로그인 <i class="fas fa-sign-in-alt"></i></button>

        <div class="social-login">
            <button class="social-login-button" type="button" onclick="location.href='/oauth2/authorization/google'">
                <i class="fab fa-google"></i> 구글 계정으로 로그인
            </button>
        </div>

        <a href="/users/register" class="register-link">아직 계정이 없으신가요? 회원가입</a>
        <a href="/" class="back-to-home"><i class="fas fa-arrow-left"></i> 메인으로 돌아가기</a>
    </form>
</body>
<script>
    function checkUsername() {
        let username = document.getElementById("username").value;
        fetch(`/user/check-username?username=${username}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById("username-error").textContent = data ? "사용 가능한 ID입니다." : "이미 사용 중인 ID입니다.";
            });
    }

    function checkNickname() {
        let nickname = document.getElementById("nickname").value;
        fetch(`/user/check-nickname?nickname=${nickname}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById("nickname-error").textContent = data ? "사용 가능한 닉네임입니다." : "이미 사용 중인 닉네임입니다.";
            });
    }
</script>

</html>
