<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 | Travel Goo</title>
    <link rel="stylesheet" href="/css/users/register.css">
</head>

<body>
    <div class="container">
        <!-- 왼쪽 패널 (어두운 배경 + 이미지) -->
        <div class="left">
            <h1>무료 계정 만들기</h1>
            <p>즐거운 여행을 위한 계정을 만들어 보세요.</p>
        </div>

        <!-- 오른쪽 패널 (회원가입 폼) -->
        <div class="right">
            <div class="form-container">
                <h2>회원가입</h2>
                <form action="/users/register" method="post" th:object="${user}">
                    <div class="form-group">
                        <label for="username">아이디</label>
                        <input type="text" id="username" th:field="*{username}" required>
                        <div class="error-message" id="username-error">아이디는 영문과 숫자만 가능합니다.</div>
                    </div>

                    <div class="form-group">
                        <label for="password">비밀번호</label>
                        <input type="password" id="password" th:field="*{password}" required>
                        <div class="error-message" id="password-error">비밀번호는 최소 8자 이상이어야 합니다.</div>
                    </div>

                    <div class="form-group">
                        <label for="name">이름</label>
                        <input type="text" id="name" th:field="*{name}" required>
                    </div>

                    <button type="submit" class="btn">계속하기 →</button>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
